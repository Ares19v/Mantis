name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:

  # ── Job 1: Python backend lint ──────────────────────────────
  lint-backend:
    name: Backend — Lint (Python)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install flake8
        run: pip install flake8

      - name: Run flake8
        run: flake8 .

  # ── Job 2: React frontend lint + build ─────────────────────
  lint-and-build-frontend:
    name: Frontend — Lint & Build (Node)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: mantis_ui

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: mantis_ui/package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Run ESLint
        run: npm run lint

      - name: Build production bundle
        run: npm run build
