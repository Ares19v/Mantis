<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>MANTIS | Real-Time Audio Intelligence</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="dashboard">
        <header>
            <h1>MANTIS</h1>
            <div id="connection-status" class="status-dot"></div>
        </header>
        
        <div class="main-grid">
            <div class="card emotion-card">
                <h3>Live Emotion</h3>
                <div id="emotion-display">WAITING...</div>
            </div>
            
            <div class="card status-card">
                <h3>System Action</h3>
                <div id="action-display">IDLE</div>
            </div>
        </div>

        <div class="controls">
            <button id="startBtn">Start Monitoring</button>
            <button id="stopBtn" disabled>Stop</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
